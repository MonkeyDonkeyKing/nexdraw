[package]
name = "nexdraw"
version = "0.0.1"
edition = "2021"
description = "A decentralized solana lottery application.."
authors = ["MickSol"]

[lib]
crate-type = ["cdylib", "lib"]


[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []


[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = "0.29.0"
solana-security-txt = "1.1"
mpl-token-metadata = { version = "3.1.0", features = [] }
solana-program = "1.17.2"

[dev-dependencies]
async-trait = "0.1.71"
solana-program-test = "1.17.2"
solana-sdk = "1.17.2"
